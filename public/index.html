<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <meta content="mobile_tab" name="shell-type"/>
  <title>Aura Music Streaming</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-tertiary": "#003824", "inverse-on-surface": "#313032", "on-secondary-fixed-variant": "#92002a", "secondary-fixed-dim": "#ffb2b7", "on-background": "#e5e1e4", "on-surface": "#e5e1e4", "on-tertiary-fixed": "#002113", "surface": "#131315", "on-primary-fixed": "#23005c", "primary-container": "#a078ff", "on-primary-container": "#340080", "secondary-container": "#b50036", "surface-dim": "#131315", "primary": "#d0bcff", "surface-container": "#201f21", "surface-container-lowest": "#0e0e10", "outline": "#958ea0", "on-error-container": "#ffdad6", "outline-variant": "#494454", "background": "#131315", "surface-tint": "#d0bcff", "inverse-surface": "#e5e1e4", "surface-bright": "#39393b", "tertiary-container": "#00a572", "error": "#ffb4ab", "tertiary": "#4edea3", "on-primary": "#3c0091", "surface-container-low": "#1c1b1d", "on-tertiary-container": "#00311f", "tertiary-fixed-dim": "#4edea3", "primary-fixed": "#e9ddff", "primary-fixed-dim": "#d0bcff", "secondary-fixed": "#ffdadb", "on-secondary": "#67001b", "inverse-primary": "#6d3bd7", "surface-container-high": "#2a2a2c", "on-tertiary-fixed-variant": "#005236", "on-primary-fixed-variant": "#5516be", "on-secondary-container": "#ffc2c4", "error-container": "#93000a", "tertiary-fixed": "#6ffbbe", "surface-container-highest": "#353437", "on-secondary-fixed": "#40000d", "on-error": "#690005", "on-surface-variant": "#cbc3d7", "secondary": "#ffb2b7", "surface-variant": "#353437" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-lg": "1.5rem", "gutter-desktop": "1.5rem", "space-xs": "0.25rem", "space-md": "1rem", "margin-desktop": "3rem", "gutter": "1rem", "space-sm": "0.5rem", "margin": "1.25rem", "space-xl": "2.5rem" }, fontFamily: { "headline-xl-mobile": ["Plus Jakarta Sans"], "headline-xl": ["Plus Jakarta Sans"], "body-sm": ["Inter"], "label-xs": ["Inter"], "headline-lg-mobile": ["Plus Jakarta Sans"], "label-lg": ["Inter"], "label-md": ["Inter"], "headline-md": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "body-lg": ["Inter"], "body-md": ["Inter"] }, fontSize: { "headline-xl-mobile": ["30px", { lineHeight: "38px", letterSpacing: "-0.025em", fontWeight: "700" }], "headline-xl": ["40px", { lineHeight: "48px", letterSpacing: "-0.03em", fontWeight: "700" }], "body-sm": ["12px", { lineHeight: "18px", letterSpacing: "0.01em", fontWeight: "400" }], "label-xs": ["9px", { lineHeight: "12px", letterSpacing: "0.08em", fontWeight: "700" }], "headline-lg-mobile": ["22px", { lineHeight: "30px", letterSpacing: "-0.015em", fontWeight: "600" }], "label-lg": ["13px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "600" }], "label-md": ["11px", { lineHeight: "14px", letterSpacing: "0.04em", fontWeight: "500" }], "headline-md": ["18px", { lineHeight: "26px", letterSpacing: "-0.01em", fontWeight: "600" }], "headline-lg": ["28px", { lineHeight: "36px", letterSpacing: "-0.02em", fontWeight: "600" }], "body-lg": ["16px", { lineHeight: "24px", letterSpacing: "-0.01em", fontWeight: "400" }], "body-md": ["14px", { lineHeight: "20px", letterSpacing: "0em", fontWeight: "400" }] } } } };
  </script>
  <style>
    @layer base { html, body { width: 100%; margin: 0; padding: 0; } body { overscroll-behavior-y: none; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }
    #now-playing-modal {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container overflow-hidden">
  
  <!-- HOME VIEW -->
  <div id="home-view" class="flex flex-col flex-1 h-screen overflow-y-auto">
    <header class="fixed top-0 w-full z-40 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
      <div class="h-16 px-margin flex items-center justify-between">
        <div class="flex items-center gap-space-sm">
          <span class="font-headline-md text-headline-md tracking-tight text-on-surface uppercase">AURA</span>
        </div>
      </div>
    </header>

    <main class="flex-1 flex flex-col relative w-full pt-16 pb-36 bg-surface">
      <div class="flex flex-col w-full pb-6">
        <!-- Sticky Search Glass Section -->
        <div class="sticky top-0 z-30 px-margin pt-2 pb-3 bg-surface/85 backdrop-blur-2xl mt-4">
          <div class="relative flex items-center w-full h-12 rounded-xl bg-surface-container-high/60 backdrop-blur-md px-3.5 shadow-sm transition-all focus-within:bg-surface-container-highest/80 focus-within:shadow-[0_0_20px_rgba(208,188,255,0.15)]">
            <span class="material-symbols-outlined text-[20px] text-outline select-none">search</span>
            <input class="w-full bg-transparent border-0 outline-none pl-2.5 pr-2 font-body-md text-body-md text-on-surface placeholder:text-outline/70 selection:bg-primary-container selection:text-on-primary-container" id="search-input" placeholder="Search YouTube for tracks..." type="text"/>
            <div id="search-loader" class="hidden w-5 h-5 border-2 border-t-primary border-r-transparent border-b-transparent border-l-transparent rounded-full animate-spin"></div>
          </div>
        </div>

        <!-- SEARCH RESULTS CONTAINER -->
        <div id="search-results-container" class="mt-4 px-margin flex flex-col hidden">
          <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-3">Search Results</h2>
          <div id="search-results-list" class="flex flex-col space-y-3">
            <!-- Dynamic results go here -->
          </div>
        </div>

        <!-- Default Content (Hidden when searching) -->
        <div id="default-content">
          <!-- Audio Spectrum Micro-Bar: Lossless Indicator -->
          <div class="px-margin pt-2 pb-1">
            <div class="flex items-center justify-between px-3.5 py-2 rounded-xl bg-surface-container-lowest/90 backdrop-blur-md">
              <div class="flex items-center gap-2">
                <span class="relative flex h-2 w-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-tertiary opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-tertiary"></span>
                </span>
                <span class="font-label-xs text-label-xs uppercase tracking-wider text-tertiary font-semibold">Direct Stream Engine Active</span>
              </div>
            </div>
          </div>

          <!-- Section: Recommended -->
          <div class="mt-8 px-margin flex flex-col">
            <div class="flex items-center justify-between mb-3.5">
              <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-[20px] text-primary">history</span>
                <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Trending Streams</h2>
              </div>
            </div>
            
            <div class="grid grid-cols-2 gap-3.5">
              <!-- Item 1: Lofi -->
              <div class="album-card group relative flex flex-col p-2.5 rounded-2xl bg-surface-container-low/70 hover:bg-surface-container/80 transition-all duration-300 shadow-sm cursor-pointer" onclick="playTrending('jfKfPfyJRdk', 'Lofi Hip Hop Radio', 'Lofi Girl', 'https://i.ytimg.com/vi/jfKfPfyJRdk/hqdefault.jpg')">
                <div class="relative w-full aspect-square rounded-xl overflow-hidden bg-surface-container">
                  <img class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" src="https://i.ytimg.com/vi/jfKfPfyJRdk/hqdefault.jpg"/>
                  <button class="play-overlay absolute bottom-2 right-2 w-9 h-9 rounded-full bg-on-surface text-surface opacity-90 flex items-center justify-center">
                    <span class="material-symbols-outlined text-[20px]">play_arrow</span>
                  </button>
                </div>
                <div class="mt-2.5 flex flex-col min-w-0">
                  <span class="font-headline-md text-body-md font-semibold text-on-surface truncate group-hover:text-primary transition-colors">Lofi Hip Hop Radio</span>
                  <span class="font-body-sm text-body-sm text-on-surface-variant truncate mt-0.5">Lofi Girl</span>
                </div>
              </div>

              <!-- Item 2: Synthwave -->
              <div class="album-card group relative flex flex-col p-2.5 rounded-2xl bg-surface-container-low/70 hover:bg-surface-container/80 transition-all duration-300 shadow-sm cursor-pointer" onclick="playTrending('4xDzrXg7eHk', 'Synthwave Radio', 'Odysseus', 'https://i.ytimg.com/vi/4xDzrXg7eHk/hqdefault.jpg')">
                <div class="relative w-full aspect-square rounded-xl overflow-hidden bg-surface-container">
                  <img class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" src="https://i.ytimg.com/vi/4xDzrXg7eHk/hqdefault.jpg"/>
                  <button class="play-overlay absolute bottom-2 right-2 w-9 h-9 rounded-full bg-on-surface text-surface opacity-90 flex items-center justify-center">
                    <span class="material-symbols-outlined text-[20px]">play_arrow</span>
                  </button>
                </div>
                <div class="mt-2.5 flex flex-col min-w-0">
                  <span class="font-headline-md text-body-md font-semibold text-on-surface truncate group-hover:text-primary transition-colors">Synthwave Radio</span>
                  <span class="font-body-sm text-body-sm text-on-surface-variant truncate mt-0.5">Odysseus</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- BOTTOM MINI PLAYER -->
  <div id="mini-player" class="fixed bottom-0 w-full z-40 pb-safe bg-surface/90 backdrop-blur-xl border-t border-surface-container-high transition-transform duration-300 transform translate-y-full">
    <div class="px-3 py-2 h-16 flex items-center justify-between cursor-pointer" onclick="toggleFullPlayer()">
      <div class="flex items-center gap-3 min-w-0 flex-1">
        <img id="mini-thumb" class="w-11 h-11 rounded-lg object-cover bg-surface-container-high" src="" />
        <div class="flex flex-col min-w-0 pr-2">
          <span id="mini-title" class="font-headline-md text-body-md text-on-surface truncate font-semibold">Title</span>
          <span id="mini-artist" class="font-body-sm text-body-sm text-on-surface-variant truncate">Artist</span>
        </div>
      </div>
      <div class="flex items-center gap-1 flex-shrink-0" onclick="event.stopPropagation();">
        <button id="mini-play-btn" class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface transition-transform active:scale-95" type="button" onclick="togglePlayPause()">
          <span class="material-symbols-outlined text-[28px]" id="mini-play-icon">play_arrow</span>
        </button>
      </div>
    </div>
    <!-- Progress bar -->
    <div class="absolute top-0 left-0 h-0.5 bg-surface-container-high w-full">
      <div id="mini-progress" class="h-full bg-primary w-0"></div>
    </div>
  </div>

  <!-- FULL SCREEN NOW PLAYING MODAL -->
  <div id="now-playing-modal" class="fixed inset-0 z-50 bg-surface flex flex-col transform translate-y-full">
    <main class="flex-1 flex flex-col relative w-full pt-safe pb-safe h-full">
      <div class="flex flex-col w-full h-full px-margin pb-space-lg select-none relative overflow-hidden">
        <!-- Ambient Atmospheric Glow Backdrops -->
        <div class="absolute -top-16 -left-16 w-72 h-72 rounded-full bg-primary-container/15 blur-3xl pointer-events-none"></div>
        <div class="absolute top-1/4 -right-20 w-80 h-80 rounded-full bg-secondary-container/10 blur-3xl pointer-events-none"></div>
        <div class="absolute bottom-12 left-1/2 -translate-x-1/2 w-96 h-48 rounded-full bg-tertiary-container/10 blur-3xl pointer-events-none"></div>
        
        <!-- Top Bar -->
        <div class="flex items-center justify-between py-space-sm z-10">
          <button class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container/60 active:scale-95 transition-all text-on-surface" type="button" onclick="toggleFullPlayer()">
            <span class="material-symbols-outlined text-[24px]">keyboard_arrow_down</span>
          </button>
          <div class="flex flex-col items-center max-w-[210px] text-center">
            <span class="font-label-xs text-label-xs uppercase tracking-wider text-outline">Now Playing</span>
            <span id="full-status" class="font-label-lg text-label-lg text-on-surface truncate w-full mt-0.5">Stream Engine Active</span>
          </div>
          <button class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container/60 active:scale-95 transition-all text-on-surface" type="button">
            <span class="material-symbols-outlined text-[20px]">more_vert</span>
          </button>
        </div>
        
        <!-- Center Stage: Album Art -->
        <div class="relative w-full max-w-[320px] mx-auto my-space-md aspect-square flex items-center justify-center z-10 flex-shrink-0">
          <div class="absolute inset-0 rounded-[28px] bg-gradient-to-tr from-primary-container/30 to-secondary/20 blur-2xl scale-95 opacity-70"></div>
          <div class="relative w-full h-full rounded-[28px] overflow-hidden bg-surface-container-high shadow-2xl flex items-center justify-center">
            <img id="full-thumb" class="w-full h-full object-cover select-none pointer-events-none" src=""/>
            <div id="full-loader" class="absolute inset-0 bg-surface/60 backdrop-blur-sm flex items-center justify-center hidden">
              <div class="w-10 h-10 border-4 border-t-primary border-r-transparent border-b-transparent border-l-transparent rounded-full animate-spin"></div>
            </div>
          </div>
        </div>
        
        <div class="flex-1"></div> <!-- spacer -->

        <!-- Track Meta -->
        <div class="flex flex-col mb-6 z-10">
          <h1 id="full-title" class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface truncate tracking-tight">Title</h1>
          <p id="full-artist" class="font-body-md text-body-md text-on-surface-variant truncate mt-0.5">Artist</p>
        </div>
        
        <!-- Interactive Scrubber -->
        <div class="w-full flex flex-col space-y-1.5 my-space-xs z-10">
          <div class="relative w-full h-4 flex items-center cursor-pointer group py-2" id="scrubber-track">
            <div class="w-full h-1.5 bg-surface-container-highest rounded-full overflow-hidden"></div>
            <div class="absolute left-0 h-1.5 bg-primary rounded-full pointer-events-none" id="scrubber-progress" style="width: 0%;"></div>
            <div class="absolute w-3.5 h-3.5 bg-on-surface rounded-full shadow-lg -ml-1.5 pointer-events-none" id="scrubber-thumb" style="left: 0%;"></div>
          </div>
          <div class="flex justify-between items-center font-label-md text-label-md text-outline">
            <span id="time-elapsed">0:00</span>
            <span id="time-total">0:00</span>
          </div>
        </div>
        
        <!-- Main Playback Transport Controls -->
        <div class="flex items-center justify-center gap-6 my-4 z-10">
          <button class="relative group w-16 h-16 rounded-full bg-on-surface text-surface flex items-center justify-center shadow-xl active:scale-95 transition-all" id="full-play-btn" type="button" onclick="togglePlayPause()">
            <div class="absolute inset-0 rounded-full bg-primary/25 blur-lg group-hover:blur-xl transition-all"></div>
            <span class="material-symbols-outlined text-[36px] relative z-10" id="full-play-icon" style="font-variation-settings: 'FILL' 1;">pause</span>
          </button>
        </div>
        
      </div>
    </main>
  </div>

  <audio id="audio-player" style="display: none;"></audio>
  <script src="/static/app.js"></script>
</body>
</html>
